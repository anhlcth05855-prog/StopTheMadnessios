name: Build StopTheMadness iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Show Xcode Version & Schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project StopTheMadnessPro.xcodeproj

      - name: Build App & Extension with Xcodebuild
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project StopTheMadnessPro.xcodeproj \
            -scheme StopTheMadnessPro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee build_app.log

          xcodebuild build \
            -project StopTheMadnessPro.xcodeproj \
            -scheme StopTheMadnessExtension \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee build_ext.log || true

      - name: Show Build Errors on Failure
        if: failure()
        run: |
          echo "=== BUILD LOG FAILURE SUMMARY ==="
          if [ -f build_app.log ]; then tail -n 120 build_app.log; fi
          if [ -f build_ext.log ]; then tail -n 120 build_ext.log; fi

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/StopTheMadnessPro.app Payload/
          mkdir -p Payload/StopTheMadnessPro.app/PlugIns
          if [ -d "build/Build/Products/Release-iphoneos/StopTheMadnessExtension.appex" ]; then
            cp -r build/Build/Products/Release-iphoneos/StopTheMadnessExtension.appex Payload/StopTheMadnessPro.app/PlugIns/
          fi
          if [ -f "iTunesMetadata.plist" ]; then
            cp iTunesMetadata.plist Payload/
          fi
          zip -qry StopTheMadnessPro.ipa Payload iTunesMetadata.plist
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StopTheMadnessPro-IPA
          path: StopTheMadnessPro.ipa
