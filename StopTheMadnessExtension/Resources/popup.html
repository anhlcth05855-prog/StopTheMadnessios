<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StopTheMadness Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="shield-badge">🛡️</div>
    <div class="title-group">
      <h3>StopTheMadness Pro</h3>
      <p id="domain-text">Current Website</p>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-box">
      <span class="stat-num" id="stat-trackers">0</span>
      <span class="stat-label">Trackers</span>
    </div>
    <div class="stat-box">
      <span class="stat-num" id="stat-amp">0</span>
      <span class="stat-label">AMP</span>
    </div>
    <div class="stat-box">
      <span class="stat-num" id="stat-autoplay">0</span>
      <span class="stat-label">Autoplay</span>
    </div>
  </div>

  <div class="toggles">
    <label class="toggle-item">
      <span>Restore Interactions</span>
      <input type="checkbox" id="toggle-interaction" checked>
    </label>
    <label class="toggle-item">
      <span>Block Trackers</span>
      <input type="checkbox" id="toggle-trackers" checked>
    </label>
    <label class="toggle-item">
      <span>Media Controls</span>
      <input type="checkbox" id="toggle-media" checked>
    </label>
    <label class="toggle-item">
      <span>Hide Annoyances</span>
      <input type="checkbox" id="toggle-annoyances" checked>
    </label>
  </div>

  <button id="btn-clean-url" class="btn-action">Sanitize Current URL</button>

  <script src="popup.js"></script>
</body>
</html>
